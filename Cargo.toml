[workspace]

[workspace.dependencies]
bevy_app = "=0.20.0-rc.2"
bevy_input = "=0.20.0-rc.2"
bevy_ecs = "=0.20.0-rc.2"
bevy_platform = "=0.20.0-rc.2"
bevy_log = "=0.20.0-rc.2"

[package]
name = "bevy_gamepad"
version = "0.1.3"
edition = "2024"
license-file = "LICENSE"
description = "Apple Game Controller Framework Integration plugin for Bevy"
repository = "https://github.com/boondocklabs/bevy_gamepad"
keywords = ["gamedev", "bevy", "joystick", "gamepad", "apple"]
categories = ["game-development", "game-engines", "hardware-support"]

[dependencies]
block2 = "0.6.0"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
objc2 = "0.6.0"
objc2-foundation = "0.3.0"
objc2-game-controller = "0.3.0"
bevy_app.workspace = true
bevy_input.workspace = true
bevy_ecs.workspace = true
bevy_platform.workspace = true
bevy_log.workspace = true
thiserror = "2.0.12"

[dev-dependencies]
bevy = { version = "=0.20.0-rc.2", default-features = false, features = [
    "android-game-activity",
    "bevy_animation",
    "gltf_animation",
    "std",
    "async_executor",
    "bevy_sprite_render",
    "bevy_ui_render",
    "bevy_gizmos_render",
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gltf",
    "mesh_picking",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_sprite",
    "sprite_picking",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "ui_picking",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "default_font",
    "hdr",
    "multi_threaded",
    "png",
    "smaa_luts",
    "sysinfo_plugin",
    "tonemapping_luts",
    "zstd_rust",
    "vorbis",
    "webgl2",
    "x11",
] }
